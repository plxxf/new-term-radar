name: SEO opportunity analysis (independent)
on:
  workflow_dispatch:
    inputs:
      source_report:
        description: 'Existing report file in repository'
        required: true
        default: 'report_test_feishu.json'
      fetch_real_seo:
        description: 'PAID DataForSEO API call (default OFF)'
        type: boolean
        required: true
        default: false
      write_feishu:
        description: 'Write records to SEO table (default OFF)'
        type: boolean
        required: true
        default: false
jobs:
  seo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate SEO candidates
        env:
          SOURCE_REPORT: ${{ inputs.source_report }}
        run: python seo_analyzer.py --input "$SOURCE_REPORT" --output seo_report.json --limit 100
      - name: Fetch real SEO metrics (paid, opt-in)
        if: ${{ inputs.fetch_real_seo }}
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: python enrich_seo_data.py --input seo_report.json --output seo_report.json --limit 50 --location 2840 --language en --live
      - name: Sync SEO Feishu table
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          SEO_FEISHU_TABLE_ID: ${{ secrets.SEO_FEISHU_TABLE_ID }}
          SEO_WRITE: ${{ inputs.write_feishu }}
        run: python sync_seo_feishu.py
      - name: Upload report for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-report
          path: seo_report.json
          if-no-files-found: ignore
